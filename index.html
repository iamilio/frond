<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f8f6"><meta name="description" content="Frond: a nature-based façade advisor for hot-arid climates. Import a building and rank façade systems against its current envelope."><title>Frond · Façade Advisor</title><link rel="icon" href="mark.svg"><link rel="stylesheet" href="studio.css"><script type="module" src="app.js"></script></head>
<body><header class="mast"><a class="wordmark" href="#workspace" aria-label="Frond workspace"><img src="mark.svg" alt=""><strong>Frond</strong><i></i><span>Nature-based façade advisor</span></a><nav class="main-nav" aria-label="Study views"><button data-tab="workspace"><i data-ico="box"></i>Workspace</button><button data-tab="compare"><i data-ico="columns-2"></i>Compare</button><button data-tab="results"><i data-ico="chart-no-axes-column"></i>Ranking</button></nav><div class="mast-actions"><button class="button primary" id="importBtn"><i data-ico="upload"></i>Import model</button><button class="icon-button project-menu" id="projectMenu" aria-label="Project options" title="Project options"><i data-ico="ellipsis"></i></button></div></header>
<main><div class="project-row"><div><div class="crumb"><span class="sample-tag" id="projectKind">DEMO PROJECT</span><span class="crumb-line"></span><span>ENVELOPE STUDY</span></div><div class="title-line"><h1 id="projectName"></h1><button id="editProject" class="quiet-icon" aria-label="Edit project details" title="Edit project details"><i data-ico="pencil"></i></button></div><div class="project-meta" id="projectMeta"></div></div><div class="save-area"><span class="save-msg" id="saveState"><i data-ico="check-check"></i>Saved locally</span><button class="button secondary" id="exportBtn"><i data-ico="download"></i>Export study</button></div></div>
<section id="workspace" class="page">
<div class="work-grid"><section class="model-pane panel"><div class="panel-head"><h2><i data-ico="box"></i>Model viewport</h2><div class="head-tools"><button class="select-pill" id="cameraBtn" aria-label="Choose camera view"><span id="cameraName">Axonometric</span><i data-ico="chevron-down"></i></button><span class="vert-line"></span><button id="expandBtn" class="quiet-icon" title="Expand viewport" aria-label="Expand viewport"><i data-ico="maximize-2"></i></button></div></div>
<div class="viewport" id="viewArea"><canvas id="scene" tabindex="0" aria-label="3D building. Drag to orbit, scroll to zoom, or use the viewport toolbar."></canvas><div class="view-badge"><span class="live-dot"></span><span id="viewLabel">Exterior view</span></div><button id="layersBtn" class="floating-icon" title="View layers" aria-label="View layers"><i data-ico="layers-2"></i></button><div id="compass" aria-hidden="true"><svg viewBox="0 0 44 48"><text x="22" y="9" text-anchor="middle">N</text><g id="needle"><path d="M22 13 16.5 36 22 32Z" fill="#4b4c41"></path><path d="M22 13 27.5 36 22 32Z" fill="#f4f2e9" stroke="#4b4c41" stroke-width="1.1"></path></g></svg></div><div class="scale" id="viewScale">10 m</div><div id="tools" class="viewport-toolbar"></div></div>
<div class="view-bottom"><span><i data-ico="mouse-pointer-2"></i><span id="viewHelp">Drag to orbit · Scroll to zoom</span></span><span class="view-unit">MODEL UNITS <b>m</b></span></div></section>
<aside class="inspector panel"><div class="panel-head"><h2><i data-ico="sliders-horizontal"></i>Design inspector</h2><span class="mini-num" id="inspectorNum"></span></div><div id="inspectorBody"></div></aside></div>
<section class="variants"><div class="section-head"><div class="section-title"><h2>Design variants</h2><span id="variantCount" class="count"></span></div><button class="button secondary small" id="addBtn"><i data-ico="plus"></i>New variant</button></div><div class="variant-grid" id="variantGrid"></div></section></section>
<section id="compare" class="page" hidden></section><section id="results" class="page" hidden></section>
</main><div id="pop"></div><dialog id="dialog"></dialog><div id="toast" role="status"></div></body></html>
